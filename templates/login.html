{% extends "base.html" %}
{% block titulo %}Entrar no Corsair{% endblock %}

{% block avulso %}
{# A unica tela sem trabalho a fazer — e onde a marca cabe inteira. #}
<div class="mar"></div>
<img class="navio-entrada" src="/static/marca/navio.png?v={{ V }}" alt="">

<div class="login-caixa">
  <div class="login-marca">
    <img src="/static/marca/posidonia.png?v={{ V }}" alt="Posidonia">
    <strong>Corsair</strong>
    <span>Registro operacional dos navios Amazon</span>
  </div>

  {% if erro %}<p class="aviso aviso-erro">{{ erro }}</p>{% endif %}

  <form method="post" action="/login" class="painel-form">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Login
      <input type="text" name="login" required autocomplete="username"
             autocapitalize="none" spellcheck="false" placeholder="navio.pathfinder">
    </label>
    <label>Senha
      <input type="password" name="senha" required autocomplete="current-password">
    </label>
    <button type="submit" class="botao-largo">Entrar</button>
  </form>
</div>
{% endblock %}
