{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}

{% block topo %}
<div class="topo"><div class="navio">Posidonia · Ship Ops</div></div>
{% endblock %}

{% block conteudo %}
<h1>Entrar</h1>
<p class="legenda">Use o login do navio.</p>

{% if erro %}<p class="aviso aviso-erro">{{ erro }}</p>{% endif %}

<form method="post" action="/login">
  <input type="hidden" name="next" value="{{ next }}">
  <label>Login
    <input type="text" name="login" required autocomplete="username"
           autocapitalize="none" spellcheck="false" placeholder="navio.pathfinder">
  </label>
  <label>Senha
    <input type="password" name="senha" required autocomplete="current-password">
  </label>
  <button type="submit">Entrar</button>
</form>
{% endblock %}
