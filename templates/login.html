{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}

{% block avulso %}
<div class="login-caixa">
  <div class="login-marca">
    <strong>Posidonia · Ship Ops</strong>
    <span>Registro de escalas</span>
  </div>

  {% if erro %}<p class="aviso aviso-erro">{{ erro }}</p>{% endif %}

  <form method="post" action="/login" class="painel-form">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Login
      <input type="text" name="login" required autocomplete="username"
             autocapitalize="none" spellcheck="false" placeholder="navio.pathfinder">
    </label>
    <label>Senha
      <input type="password" name="senha" required autocomplete="current-password">
    </label>
    <button type="submit" class="botao-largo">Entrar</button>
  </form>
</div>
{% endblock %}
