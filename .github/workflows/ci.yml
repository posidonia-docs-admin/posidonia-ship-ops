name: testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # A suite roda nos DOIS drivers. O libsql e o de producao (Turso) e
        # devolve tuplas onde o sqlite3 devolve Row — diferenca que ja derrubou
        # o app depois de um deploy. Rodar so num dos dois nao prova nada.
        backend: ["sqlite", "libsql-local"]
    name: pytest (${{ matrix.backend }})
    env:
      SHIPOPS_SECRET_KEY: chave-de-ci-sem-valor-em-producao
      SHIPOPS_BACKEND: ${{ matrix.backend == 'libsql-local' && 'libsql-local' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # o teste de migracao le versoes publicadas com git show
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app
      - run: python -m pytest -q
